# Optional local UI bridge: keep upstream localhost-only diagnostics on container loopback.
services:
  skyvern:
    ports:
      - 127.0.0.1:8021:8030
  ui-local-api:
    image: nginx@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
    network_mode: service:skyvern
    volumes:
      - ./procurement/deployment/ui-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      skyvern:
        condition: service_healthy
